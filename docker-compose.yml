version: "3.9"

services:
  # ── Tenacious Conversion Engine API ─────────────────────────────────────────
  api:
    build: .
    container_name: tenacious_api
    ports:
      - "${PORT:-8000}:8000"
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./eval:/app/eval
    depends_on:
      - calcom
    restart: unless-stopped

  # ── Cal.com (self-hosted) ────────────────────────────────────────────────────
  calcom:
    image: calcom/cal.com:latest
    container_name: tenacious_calcom
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://calcom:calcom@calcom_db:5432/calcom
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=tenacious-dev-secret-change-in-prod
      - CALCOM_LICENSE_KEY=
    depends_on:
      - calcom_db
    restart: unless-stopped

  calcom_db:
    image: postgres:15
    container_name: tenacious_calcom_db
    environment:
      POSTGRES_USER: calcom
      POSTGRES_PASSWORD: calcom
      POSTGRES_DB: calcom
    volumes:
      - calcom_postgres:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  calcom_postgres:
